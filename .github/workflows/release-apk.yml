name: Release APK

on:
  # 在 GitHub 上发布 Release 时自动构建
  release:
    types: [published]
  # 也允许在 Actions 页面手动触发，便于测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，但 sdkmanager 不一定在 PATH，
      # 因此先定位 cmdline-tools 下的 sdkmanager 再安装所需组件。
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find -L "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      # 仓库未包含 gradle-wrapper.jar，因此由 action 安装指定版本 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-local}"
          cp app/build/outputs/apk/release/app-release.apk "dist/AngryBirds-${VERSION}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angry-birds-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.apk
          fail_on_unmatched_files: true
